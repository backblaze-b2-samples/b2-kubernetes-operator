name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # GitHub release
      packages: write      # GHCR image and chart
      id-token: write      # keyless cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test

      - name: Set up QEMU
        run: docker run --rm --privileged tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all
      - name: Set up Buildx
        run: |
          docker buildx create --use --name builder --driver docker-container
          docker buildx inspect --bootstrap
      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build and push image
        id: build
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --provenance "mode=max,builder-id=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --sbom true \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")"
          test -n "$digest" && test "$digest" != null
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        env:
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Install Helm
        env:
          HELM_VERSION: v4.3.2
          HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Package and push chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/b2-kubernetes-operator --version "${version}" --app-version "${GITHUB_REF_NAME}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "b2-kubernetes-operator-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Bundle CRDs
        run: cat config/crd/bases/*.yaml > crds.yaml

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version} " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
            gh release upload "${GITHUB_REF_NAME}" crds.yaml b2-kubernetes-operator-*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" crds.yaml b2-kubernetes-operator-*.tgz \
              --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
          fi

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
