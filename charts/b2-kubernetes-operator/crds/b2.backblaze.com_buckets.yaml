---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: buckets.b2.backblaze.com
spec:
  group: b2.backblaze.com
  names:
    categories:
    - b2
    kind: Bucket
    listKind: BucketList
    plural: buckets
    shortNames:
    - b2bucket
    singular: bucket
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bucketName
      name: Bucket
      type: string
    - jsonPath: .spec.bucketType
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.bucketID
      name: Bucket ID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Bucket is a B2 bucket managed by the operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BucketSpec is the desired state of a B2 bucket. Lifecycle rules, CORS
              rules, bucket info, default encryption and replication are authoritative:
              whatever is in B2 is replaced by the spec. Object Lock is only managed
              when set.
            properties:
              adoptExisting:
                description: |-
                  AdoptExisting allows taking over a bucket that already exists in the
                  account and is not owned by another resource. Must also be allowed by
                  a B2AccessPolicy. Adoption replaces the bucket's lifecycle rules, CORS
                  rules and bucket info with this spec.
                type: boolean
              bucketInfo:
                additionalProperties:
                  type: string
                description: |-
                  BucketInfo is user metadata stored with the bucket. B2 lowercases keys,
                  so keys must be lowercase. One entry is used by the operator.
                maxProperties: 9
                type: object
                x-kubernetes-validations:
                - message: bucketInfo keys must be lowercase
                  rule: self.all(k, k == k.lowerAscii())
                - message: bucketInfo keys b2operator-owner-uid and b2operator-released-from
                    are reserved
                  rule: '!(''b2operator-owner-uid'' in self) && !(''b2operator-released-from''
                    in self)'
              bucketName:
                description: BucketName is the globally unique B2 bucket name. Immutable.
                maxLength: 63
                minLength: 6
                pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$
                type: string
                x-kubernetes-validations:
                - message: bucketName is immutable
                  rule: self == oldSelf
                - message: bucket names may not start with b2-
                  rule: '!self.lowerAscii().startsWith(''b2-'')'
                - message: bucket names may not contain adjacent periods
                  rule: '!self.contains(''..'')'
                - message: bucket names may not look like an IPv4 address
                  rule: '!self.matches(''^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$'')'
              bucketType:
                default: allPrivate
                description: BucketType is allPrivate (default) or allPublic.
                enum:
                - allPrivate
                - allPublic
                type: string
              corsRules:
                description: CORSRules replace the bucket's CORS rules.
                items:
                  description: CORSRule allows cross-origin browser requests to the
                    bucket.
                  properties:
                    allowedHeaders:
                      description: AllowedHeaders browsers may send in preflighted
                        requests.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    allowedOperations:
                      description: AllowedOperations are the operations browsers may
                        perform.
                      items:
                        description: CORSOperation is a B2 or S3 operation a CORS
                          rule can allow.
                        enum:
                        - b2_download_file_by_name
                        - b2_download_file_by_id
                        - b2_upload_file
                        - b2_upload_part
                        - s3_delete
                        - s3_get
                        - s3_head
                        - s3_post
                        - s3_put
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    allowedOrigins:
                      description: AllowedOrigins are origins such as "https://app.example.com",
                        or "*".
                      items:
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    exposeHeaders:
                      description: ExposeHeaders browsers may read from responses.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    maxAgeSeconds:
                      default: 3600
                      description: MaxAgeSeconds browsers may cache a preflight response.
                      format: int32
                      maximum: 86400
                      minimum: 0
                      type: integer
                    name:
                      description: Name identifies the rule.
                      maxLength: 50
                      minLength: 6
                      pattern: ^[A-Za-z0-9-]+$
                      type: string
                  required:
                  - allowedOperations
                  - allowedOrigins
                  - name
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              defaultEncryption:
                default:
                  mode: SSE-B2
                description: |-
                  DefaultEncryption is the bucket's default server-side encryption.
                  Defaults to SSE-B2; mode None requires buckets.allowUnencrypted in a
                  B2AccessPolicy.
                properties:
                  mode:
                    description: Mode is SSE-B2 (Backblaze-managed keys, AES-256)
                      or None.
                    enum:
                    - None
                    - SSE-B2
                    type: string
                required:
                - mode
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy decides whether deleting this resource deletes the
                  bucket. Defaults to Retain.
                enum:
                - Retain
                - Delete
                type: string
              lifecycleRules:
                description: LifecycleRules replace the bucket's lifecycle rules.
                items:
                  description: |-
                    LifecycleRule hides and deletes file versions by age. See
                    https://www.backblaze.com/docs/cloud-storage-lifecycle-rules.
                  properties:
                    daysFromHidingToDeleting:
                      description: |-
                        DaysFromHidingToDeleting deletes hidden file versions this many days
                        after they were hidden.
                      format: int32
                      minimum: 1
                      type: integer
                    daysFromStartingToCancelingUnfinishedLargeFiles:
                      description: |-
                        DaysFromStartingToCancelingUnfinishedLargeFiles cancels large file
                        uploads that are still unfinished this many days after they started.
                      format: int32
                      minimum: 1
                      type: integer
                    daysFromUploadingToHiding:
                      description: DaysFromUploadingToHiding hides files this many
                        days after upload.
                      format: int32
                      minimum: 1
                      type: integer
                    fileNamePrefix:
                      description: |-
                        FileNamePrefix selects the files the rule applies to. Empty applies
                        to every file in the bucket.
                      maxLength: 1024
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: a lifecycle rule must set at least one of the day counts
                    rule: has(self.daysFromUploadingToHiding) || has(self.daysFromHidingToDeleting)
                      || has(self.daysFromStartingToCancelingUnfinishedLargeFiles)
                maxItems: 100
                type: array
                x-kubernetes-list-type: atomic
              objectLock:
                description: |-
                  ObjectLock, when set, is enforced. When omitted, the bucket's Object
                  Lock settings are left as they are.
                properties:
                  defaultRetention:
                    description: DefaultRetention for new files. Omit to have no default
                      retention.
                    properties:
                      duration:
                        description: Duration of the retention period, in Unit.
                        format: int32
                        minimum: 1
                        type: integer
                      mode:
                        description: |-
                          Mode is governance (can be bypassed with bypassGovernance) or
                          compliance (cannot be shortened or removed by anyone).
                        enum:
                        - governance
                        - compliance
                        type: string
                      unit:
                        description: Unit of Duration.
                        enum:
                        - days
                        - years
                        type: string
                    required:
                    - duration
                    - mode
                    - unit
                    type: object
                  enabled:
                    description: Enabled turns on Object Lock. It cannot be turned
                      off again.
                    type: boolean
                    x-kubernetes-validations:
                    - message: Object Lock cannot be disabled once enabled
                      rule: '!oldSelf || self'
                required:
                - enabled
                type: object
                x-kubernetes-validations:
                - message: 'defaultRetention requires enabled: true'
                  rule: '!has(self.defaultRetention) || self.enabled'
              providerConfigRef:
                default:
                  name: default
                description: ProviderConfigRef selects the B2 account.
                properties:
                  name:
                    default: default
                    description: Name of the ClusterProviderConfig.
                    maxLength: 253
                    minLength: 1
                    type: string
                type: object
              replication:
                description: |-
                  Replication replicates new (and optionally existing) files to other
                  Buckets in this namespace, which may be in other B2 accounts and
                  regions. The operator creates and manages the replication keys in
                  both accounts. B2 allows at most two rules per source bucket.
                items:
                  description: ReplicationRule is a Cloud Replication rule from this
                    bucket.
                  properties:
                    destinationBucketRef:
                      description: DestinationBucketRef names the destination Bucket
                        in this namespace.
                      properties:
                        name:
                          description: Name of the Bucket resource.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    enabled:
                      default: true
                      description: Enabled pauses the rule when false.
                      type: boolean
                    fileNamePrefix:
                      description: FileNamePrefix limits replication to files with
                        this prefix.
                      maxLength: 1024
                      type: string
                    includeExistingFiles:
                      description: |-
                        IncludeExistingFiles also replicates files that existed before the
                        rule was created.
                      type: boolean
                    name:
                      description: Name of the rule in B2.
                      maxLength: 50
                      minLength: 1
                      pattern: ^[A-Za-z0-9-]+$
                      type: string
                    priority:
                      default: 1
                      description: Priority resolves conflicts between rules; higher
                        wins.
                      format: int32
                      maximum: 2147483647
                      minimum: 1
                      type: integer
                  required:
                  - destinationBucketRef
                  - name
                  type: object
                maxItems: 2
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - bucketName
            type: object
          status:
            description: BucketStatus is the observed state of a Bucket.
            properties:
              bucketID:
                description: BucketID is the B2 bucket ID.
                type: string
              conditions:
                description: Conditions describe the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: LastSyncTime is when the bucket was last compared with
                  B2.
                format: date-time
                type: string
              objectLockEnabled:
                description: ObjectLockEnabled reports whether Object Lock is on in
                  B2.
                type: boolean
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
              replication:
                description: Replication reports the replication keys the operator
                  manages.
                properties:
                  destinations:
                    description: Destinations are the buckets replicated to.
                    items:
                      description: ReplicationDestinationStatus is one destination
                        bucket.
                      properties:
                        bucket:
                          description: Bucket is the destination Bucket resource.
                          type: string
                        bucketID:
                          description: BucketID is the destination B2 bucket.
                          type: string
                        keyID:
                          description: KeyID is the key, in the destination account,
                            that writes replicated files.
                          type: string
                        providerConfig:
                          description: ProviderConfig is the destination bucket's
                            account.
                          type: string
                      required:
                      - bucket
                      - bucketID
                      - keyID
                      - providerConfig
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - bucketID
                    x-kubernetes-list-type: map
                  sourceKeyID:
                    description: |-
                      SourceKeyID is the key, in this bucket's account, that B2 uses to read
                      files for replication.
                    type: string
                type: object
              revision:
                description: Revision is the B2 bucket revision last observed.
                format: int64
                type: integer
              s3Endpoint:
                description: S3Endpoint is the S3-compatible endpoint for the bucket's
                  account.
                type: string
              s3Region:
                description: S3Region is the region to use with S3-compatible clients.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
