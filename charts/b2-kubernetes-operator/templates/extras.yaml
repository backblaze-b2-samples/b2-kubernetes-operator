{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "b2-kubernetes-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2-kubernetes-operator.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "b2-kubernetes-operator.selectorLabels" . | nindent 6 }}
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "b2-kubernetes-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b2-kubernetes-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "b2-kubernetes-operator.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8081
        {{- if .Values.metrics.enabled }}
        - port: {{ .Values.metrics.port }}
        {{- end }}
---
{{- end }}
{{- if .Values.defaultProviderConfig.create }}
{{- if not .Values.defaultProviderConfig.existingSecret }}
{{- fail "defaultProviderConfig.existingSecret is required when defaultProviderConfig.create is true" }}
{{- end }}
apiVersion: b2.backblaze.com/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: default
  labels:
    {{- include "b2-kubernetes-operator.labels" . | nindent 4 }}
spec:
  apiURL: {{ .Values.defaultProviderConfig.apiURL }}
  credentialsSecretRef:
    namespace: {{ .Release.Namespace }}
    name: {{ .Values.defaultProviderConfig.existingSecret }}
{{- end }}
