---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: b2accounts.b2.backblaze.com
spec:
  group: b2.backblaze.com
  names:
    categories:
    - b2
    kind: B2Account
    listKind: B2AccountList
    plural: b2accounts
    shortNames:
    - b2acct
    singular: b2account
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.customer
      name: Customer
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.accountID
      name: Account
      type: string
    - jsonPath: .status.email
      name: Email
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          B2Account is a B2 account created through the Backblaze Partner API for
          one customer in one region. The operator stores its application key, and
          publishes a ClusterProviderConfig for it so Buckets and ApplicationKeys
          can be created in it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              B2AccountSpec is a B2 account provisioned through the Partner API for one
              customer in one region.
            properties:
              access:
                description: Access, when set, grants the selected namespaces use
                  of the account.
                properties:
                  buckets:
                    description: BucketPolicy limits which buckets namespaces may
                      manage or reference.
                    properties:
                      allowAdoption:
                        description: |-
                          AllowAdoption permits spec.adoptExisting, taking over management of a
                          bucket that already exists in the account and matches NamePatterns.
                        type: boolean
                      allowComplianceRetention:
                        description: |-
                          AllowComplianceRetention permits Object Lock default retention in
                          compliance mode. Compliance-mode files cannot be deleted by anyone
                          until their retention expires, so this can lock in storage costs.
                        type: boolean
                      allowDeletion:
                        description: |-
                          AllowDeletion permits deletionPolicy Delete, which deletes the B2
                          bucket (if empty) when the Bucket resource is deleted.
                        type: boolean
                      allowPublic:
                        description: AllowPublic permits bucketType allPublic.
                        type: boolean
                      allowReplication:
                        description: |-
                          AllowReplication permits Cloud Replication rules. Replication to
                          another region or account incurs storage in the destination.
                        type: boolean
                      allowUnencrypted:
                        description: AllowUnencrypted permits defaultEncryption mode
                          None.
                        type: boolean
                      namePatterns:
                        description: |-
                          NamePatterns are glob patterns (`*` matches any run of characters) that
                          bucket names must match. The literal `{namespace}` is replaced with the
                          requesting namespace, e.g. `acme-{namespace}-*`. A name must match at
                          least one pattern to be created, adopted, or referenced by a key
                          through spec.bucketName. An empty list allows no buckets.
                        items:
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                  keys:
                    description: KeyPolicy limits the application keys namespaces
                      may create.
                    properties:
                      allowAccountWide:
                        description: AllowAccountWide permits keys that are not restricted
                          to a bucket.
                        type: boolean
                      allowExternalBuckets:
                        description: |-
                          AllowExternalBuckets permits keys for buckets that are not managed by
                          a Bucket resource in the same namespace (spec.bucketName). The bucket
                          name must still match buckets.namePatterns.
                        type: boolean
                      allowedCapabilities:
                        description: |-
                          AllowedCapabilities is the set of capabilities keys may be granted.
                          The key-management capabilities (listKeys, writeKeys, deleteKeys) are
                          additionally blocked by the operator unless it runs with
                          --allow-key-management-capabilities.
                        items:
                          description: Capability is a B2 application key capability.
                          enum:
                          - listKeys
                          - writeKeys
                          - deleteKeys
                          - listAllBucketNames
                          - listBuckets
                          - readBuckets
                          - writeBuckets
                          - deleteBuckets
                          - readBucketRetentions
                          - writeBucketRetentions
                          - readBucketEncryption
                          - writeBucketEncryption
                          - readBucketNotifications
                          - writeBucketNotifications
                          - listFiles
                          - readFiles
                          - shareFiles
                          - writeFiles
                          - deleteFiles
                          - readFileLegalHolds
                          - writeFileLegalHolds
                          - readFileRetentions
                          - writeFileRetentions
                          - bypassGovernance
                          - readBucketLogging
                          - writeBucketLogging
                          - readBucketReplications
                          - writeBucketReplications
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      allowedDeliveryTargets:
                        description: |-
                          AllowedDeliveryTargets lists the remote clusters and namespaces that
                          keys may be delivered to with spec.deliverTo. Empty allows none.
                        items:
                          description: DeliveryTargetPattern allows delivery to matching
                            remote namespaces.
                          properties:
                            namespaces:
                              description: |-
                                Namespaces are glob patterns for the remote namespace. {namespace} is
                                replaced with the requesting namespace, e.g. "{namespace}" or
                                "storage". Empty allows none.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: set
                            remoteCluster:
                              description: RemoteCluster name, or a glob pattern;
                                "*" allows any.
                              minLength: 1
                              type: string
                          required:
                          - remoteCluster
                          type: object
                        maxItems: 64
                        type: array
                      maxValidity:
                        description: |-
                          MaxValidity, if set, requires every key to set spec.validFor no longer
                          than this duration.
                        type: string
                    type: object
                  namespaceSelector:
                    description: NamespaceSelector selects the customer's namespaces.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - namespaceSelector
                type: object
              adoptExisting:
                description: |-
                  AdoptExisting allows taking over a Group member that already exists
                  with this resource's email address. Its application key must already
                  be in the credentials Secret.
                type: boolean
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef is where the account's application key is
                  stored. B2 returns the key only once, so the Secret is never deleted
                  by the operator, whatever the deletion policy.
                properties:
                  name:
                    description: Name of the Secret. Defaults to b2-account-<resource
                      name>.
                    maxLength: 253
                    type: string
                  namespace:
                    description: |-
                      Namespace of the Secret. It should be readable only by cluster
                      administrators, e.g. the operator's namespace.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - namespace
                type: object
              customer:
                description: |-
                  Customer identifies the customer, e.g. a customer number. It is
                  substituted for {customer} in the partner's memberEmailTemplate.
                maxLength: 48
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$
                type: string
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy is Retain (default: keep the account in the Group) or
                  Eject (remove it from the Group; the account keeps existing).
                enum:
                - Retain
                - Eject
                type: string
              partnerConfigRef:
                description: |-
                  PartnerConfigRef names the ClusterProviderConfig of the Group admin
                  account. It must have spec.partner set.
                properties:
                  name:
                    default: default
                    description: Name of the ClusterProviderConfig.
                    maxLength: 253
                    minLength: 1
                    type: string
                type: object
              providerConfigName:
                description: |-
                  ProviderConfigName is the ClusterProviderConfig the operator creates
                  for the account, which Buckets and ApplicationKeys reference.
                  Defaults to the resource name.
                maxLength: 253
                type: string
              region:
                description: Region the account's data lives in.
                enum:
                - us-east
                - us-west
                - ca-east
                - eu-central
                type: string
            required:
            - credentialsSecretRef
            - customer
            - partnerConfigRef
            - region
            type: object
            x-kubernetes-validations:
            - message: customer, region and partnerConfigRef are immutable
              rule: self.customer == oldSelf.customer && self.region == oldSelf.region
                && self.partnerConfigRef.name == oldSelf.partnerConfigRef.name
          status:
            description: B2AccountStatus is the observed state of a B2Account.
            properties:
              accountID:
                description: AccountID of the B2 account.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsSecret:
                description: CredentialsSecret is namespace/name of the stored application
                  key.
                type: string
              email:
                description: Email the account was created with. Fixed at creation.
                type: string
              groupID:
                description: GroupID and GroupName the account belongs to.
                type: string
              groupName:
                type: string
              observedGeneration:
                format: int64
                type: integer
              operationsKeyID:
                description: |-
                  OperationsKeyID is the application key the operator created in the
                  account for day-to-day management; the master key is kept but unused.
                type: string
              providerConfigName:
                description: ProviderConfigName is the ClusterProviderConfig created
                  for the account.
                type: string
              s3Endpoint:
                description: S3Endpoint for the account's region.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
