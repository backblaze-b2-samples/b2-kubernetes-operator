    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterProviderConfig holds the credentials the operator uses for one B2
          account. Only cluster administrators should be able to create or read it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterProviderConfigSpec configures access to one B2 account.
            properties:
              apiURL:
                default: https://api.backblazeb2.com
                description: APIURL is the B2 authorization endpoint.
                pattern: ^https?://[^\s/]+(:[0-9]+)?/?$
                type: string
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef points at the application key the operator uses
                  for this account. It needs listBuckets, readBuckets, writeBuckets and
                  deleteBuckets to manage buckets; listKeys, writeKeys and deleteKeys to
                  manage keys; read/writeBucketEncryption and read/writeBucketRetentions
                  for encryption and Object Lock settings; and every capability it must
                  be able to grant to the keys it creates.
                properties:
                  applicationKeyIdKey:
                    default: applicationKeyId
                    description: Key in the Secret holding the application key ID.
                    type: string
                  applicationKeyKey:
                    default: applicationKey
                    description: Key in the Secret holding the application key.
                    type: string
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the Secret.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - credentialsSecretRef
            type: object
          status:
